<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3A2C">
<title>칩 뱅크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#0E3A2C; --felt-2:#155441; --felt-line:rgba(242,234,216,.14);
  --rail:#3A2417; --ivory:#F2EAD8; --muted:rgba(242,234,216,.62);
  --gold:#D8B04A; --red:#B8322A; --blue:#2C5AA8; --ink:#1B1B1F; --danger:#E0664F;
  --num:'Oswald', 'IBM Plex Sans KR', system-ui, sans-serif;
  --body:'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--rail)}
body{margin:0;min-height:100vh;font:15px/1.5 var(--body);color:var(--ivory);
  background:radial-gradient(120% 80% at 50% 0%, var(--felt-2) 0%, var(--felt) 60%, #0A2E23 100%) fixed;
  -webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:700}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--felt-line);background:rgba(0,0,0,.18);border-radius:10px;padding:11px 14px;font-weight:600}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-gold{background:var(--gold);color:#2A1C08;border-color:transparent}
.btn-red{background:var(--red);border-color:transparent}
.btn-ghost{background:transparent}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--felt-line);background:rgba(0,0,0,.25);outline:none}
.field input:focus{border-color:var(--gold)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.card{border:1px solid var(--felt-line);border-radius:14px;padding:16px;background:rgba(0,0,0,.14);margin-bottom:14px}

/* Home */
.brand{text-align:center;padding:28px 0 22px}
.brand h1{font-family:var(--num);font-size:44px;font-weight:600;line-height:1}
.brand p{margin:6px 0 0;color:var(--muted)}
.brand .mark{display:flex;justify-content:center;margin-bottom:14px;gap:-8px}
.brand .mark i{width:34px;height:34px;border-radius:50%;margin:0 -5px;border:3px dashed rgba(255,255,255,.8);box-shadow:0 0 0 3px var(--c)}
.home h2{font-size:17px;margin-bottom:12px}

/* Room header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.code{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.code b{font-family:var(--num);font-size:20px;color:var(--ivory);letter-spacing:.12em}
.dot{width:8px;height:8px;border-radius:50%;background:#777}
.dot.on{background:#6CD48A}

/* Pot */
.pot{text-align:center;padding:14px 0 18px}
.stack{height:64px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start}
.stack i{display:block;width:74px;height:12px;border-radius:50%/50%;margin-top:-5px;background:var(--c);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.25);
  background-image:repeating-linear-gradient(90deg, transparent 0 9px, rgba(255,255,255,.75) 9px 13px)}
.pot .amt{font-family:var(--num);font-size:56px;font-weight:600;line-height:1.05;color:var(--gold);display:inline-block}
.pot .sub{font-size:13px;color:var(--muted)}
.bump{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

/* My panel */
.mine{border-radius:18px;padding:16px;background:rgba(0,0,0,.24);border:1px solid var(--felt-line);margin-bottom:18px}
.mine-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.mine-head .big{font-family:var(--num);font-size:34px;font-weight:600;line-height:1}
.mine-head small{display:block;font-size:12px;color:var(--muted)}
.chips{display:flex;justify-content:space-between;gap:6px;margin-bottom:14px}
.chip{--c:var(--ivory);--t:var(--ink);position:relative;width:68px;height:68px;border-radius:50%;border:0;padding:0;
  background:repeating-conic-gradient(from 8deg, var(--c) 0 22deg, #fff 22deg 30deg, var(--c) 30deg 45deg);
  box-shadow:0 3px 0 rgba(0,0,0,.35), 0 6px 12px rgba(0,0,0,.25)}
.chip::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--c);border:2px dashed rgba(255,255,255,.7)}
.chip span{position:relative;font:600 16px var(--num);color:var(--t)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.chip[disabled]{filter:grayscale(.8);opacity:.45}
.chip.c1{--c:var(--ivory);--t:var(--ink)}
.chip.c2{--c:var(--red);--t:#fff}
.chip.c3{--c:var(--blue);--t:#fff}
.chip.c4{--c:var(--ink);--t:var(--gold)}
.stake{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.stake .val{flex:1;font-family:var(--num);font-size:24px;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--felt-line);min-width:0}
.stake input{width:100%;background:transparent;border:0;outline:none;font:inherit}
.actions{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}

/* Players */
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.sec-h h3{font-size:15px}
.players{list-style:none;margin:0 0 18px;padding:0;border-top:1px solid var(--felt-line)}
.players li{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--felt-line)}
.players li.tap{cursor:pointer}
.players .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.players .tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.tag.me{background:var(--ivory);color:var(--ink)}
.tag.host{background:var(--gold);color:#2A1C08}
.players .ch{font-family:var(--num);font-size:18px;text-align:right;min-width:72px}
.players .bt{font-size:12px;color:var(--muted);text-align:right;min-width:62px}
.players .bt b{font-family:var(--num);color:var(--ivory);font-weight:500;font-size:14px}
.players .bust .ch{color:var(--danger)}
.players li.fold{opacity:.45}
.tag.fold{background:rgba(242,234,216,.2);color:var(--ivory)}
.fold-note{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:10px;border-radius:10px;background:rgba(0,0,0,.3);font-size:14px}
.pick{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none}
li.sel .pick{background:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 3px var(--felt)}
.award-bar{border:1px solid var(--gold);border-radius:12px;padding:12px;margin-bottom:10px;background:rgba(216,176,74,.08)}
.award-bar p{margin:0 0 10px;font-size:14px}

.host-tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px}
.host-tools .btn{font-size:13px;padding:10px 6px}

.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--felt-line)}
.log time{color:var(--muted);font-family:var(--num);flex:none}

.gone{text-align:center;padding:24px 16px}

/* Dialog */
dialog{border:0;border-radius:18px;padding:20px;background:#12382C;color:var(--ivory);width:min(92vw,380px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{font-size:18px;margin-bottom:12px}
.qr{background:#fff;border-radius:12px;padding:14px;display:flex;justify-content:center;margin-bottom:12px}
.qr img,.qr canvas{display:block;max-width:100%;height:auto}
.inv-code{text-align:center;font-family:var(--num);font-size:34px;letter-spacing:.18em;margin-bottom:4px}
.url{font-size:12px;color:var(--muted);word-break:break-all;text-align:center;margin-bottom:14px}
.stack-btns{display:grid;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ivory);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;
  opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.setup ol{padding-left:20px;margin:0}
.setup li{margin-bottom:10px}
.setup code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:5px;font-size:13px}

@media (prefers-reduced-motion:reduce){.bump{animation:none}.toast{transition:none}}
@media (max-width:360px){.chip{width:60px;height:60px}.pot .amt{font-size:46px}}

.inp-code{flex:1;min-width:0;width:100%;padding:12px;border-radius:10px;border:1px solid var(--felt-line);background:rgba(0,0,0,.25);outline:none;font-family:var(--num);font-size:20px;letter-spacing:.14em}
.inp-code:focus{border-color:var(--gold)}
.rooms{list-style:none;margin:0;padding:0}
.rooms li{padding:2px 0}
.rooms li.muted{font-size:14px;padding:6px 0}
.room-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--felt-line);background:rgba(0,0,0,.2);text-align:left;margin-bottom:8px}
.room-btn .rc{font-family:var(--num);font-size:20px;letter-spacing:.1em;flex:none}
.room-btn .ri{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.35}
.room-btn .ri b{color:var(--ivory);font-weight:600}
.room-btn .tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--gold);color:#2A1C08;flex:none}
body.busy #mine .btn,body.busy #mine .chip,body.busy .host-tools .btn,body.busy #award-bar .btn{pointer-events:none;opacity:.55}
</style>
</head>
<body>
<div id="app">

  <section id="scr-home" class="home" hidden>
    <div class="brand">
      <div class="mark"><i style="--c:var(--red);background:var(--red)"></i><i style="--c:var(--blue);background:var(--blue)"></i><i style="--c:var(--ink);background:var(--ink)"></i></div>
      <h1>칩 뱅크</h1>
      <p>칩 없이 각자 폰으로 베팅하세요</p>
    </div>

    <div class="card">
      <div class="sec-h" style="margin-bottom:10px"><h2 style="margin:0">방 목록</h2>
        <button class="btn btn-ghost" id="btn-lobby-refresh" style="padding:6px 10px;font-size:13px">새로고침</button></div>
      <ul class="rooms" id="rooms"><li class="muted">불러오는 중…</li></ul>
    </div>

    <div class="card">
      <h2>새 방 만들기</h2>
      <label class="field"><span>내 이름 (딜러)</span><input id="host-name" maxlength="12" placeholder="이름"></label>
      <div class="row">
        <label class="field"><span>시작 칩</span><input id="host-stack" type="number" inputmode="numeric" value="1000" min="1"></label>
        <label class="field"><span>최소 단위</span><input id="host-unit" type="number" inputmode="numeric" value="10" min="1"></label>
      </div>
      <p class="muted" style="font-size:13px;margin:-4px 0 12px">칩 버튼은 최소 단위의 1·5·25·100배로 만들어집니다.</p>
      <button class="btn btn-gold" id="btn-create" style="width:100%">방 만들기</button>
    </div>

    <div class="card">
      <h2>코드로 참가</h2>
      <div class="row">
        <input id="join-code" class="inp-code" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="방 코드 6자리">
        <button class="btn" id="btn-go" style="flex:none">들어가기</button>
      </div>
    </div>
  </section>

  <section id="scr-room" hidden>
    <div class="top">
      <div class="code"><span class="dot" id="conn"></span>방 <b id="room-code">------</b></div>
      <div class="row" style="flex:none;gap:6px">
        <button class="btn btn-ghost" id="btn-home" style="padding:8px 10px;font-size:13px">나가기</button>
        <button class="btn" id="btn-invite" style="padding:8px 12px;font-size:13px">초대 QR</button>
      </div>
    </div>

    <div class="card" id="loading" style="text-align:center">불러오는 중…</div>

    <div class="card" id="missing" hidden>
      <p style="margin:0 0 12px">이 방을 찾을 수 없습니다. 코드가 틀렸거나 만든 지 12시간이 지나 기록이 지워졌습니다.</p>
      <button class="btn btn-gold" id="btn-missing-home" style="width:100%">처음 화면으로</button>
    </div>

    <div id="room-body" hidden>
      <div class="pot">
        <div class="stack" id="pot-stack" aria-hidden="true"></div>
        <div class="amt" id="pot-amt">0</div>
        <div class="sub" id="pot-sub">팟</div>
      </div>

      <div class="card" id="join-panel" hidden>
        <h2 style="font-size:17px;margin-bottom:12px">테이블에 앉기</h2>
        <label class="field"><span>내 이름</span><input id="join-name" maxlength="12" autocomplete="nickname" placeholder="테이블에서 부를 이름"></label>
        <button class="btn btn-gold" id="btn-join" style="width:100%">참가하기</button>
      </div>

      <div class="mine" id="mine" hidden>
        <div class="mine-head">
          <div><small>내 칩</small><div class="big" id="my-chips">0</div></div>
          <div style="text-align:right"><small>이번 판 내 베팅</small><div class="num" style="font-size:20px" id="my-bet">0</div></div>
        </div>
        <div class="chips" id="chip-row"></div>
        <div class="stake">
          <div class="val"><input id="stake" type="number" inputmode="numeric" min="0" value="0" aria-label="베팅 금액"></div>
          <button class="btn btn-ghost" id="btn-clear">지우기</button>
        </div>
        <button class="btn btn-gold" id="btn-bet" style="width:100%;margin-bottom:8px;font-size:17px">베팅</button>
        <div class="fold-note" id="fold-note" hidden><span>이번 판 다이했습니다</span>
          <button class="btn btn-ghost" id="btn-unfold" style="padding:6px 10px;font-size:13px">다이 취소</button></div>
        <div class="actions">
          <button class="btn" id="btn-fold">다이</button>
          <button class="btn" id="btn-call">체크</button>
          <button class="btn btn-red" id="btn-allin">올인</button>
        </div>
      </div>

      <div id="award-bar" class="award-bar" hidden>
        <p>팟을 받을 사람을 고르세요. 여러 명이면 균등하게 나눕니다.</p>
        <div class="row">
          <button class="btn btn-ghost" id="btn-award-cancel">취소</button>
          <button class="btn btn-gold" id="btn-award-ok">지급하기</button>
        </div>
      </div>

      <div class="sec-h"><h3>참가자</h3><span class="muted" style="font-size:12px" id="host-hint"></span></div>
      <ul class="players" id="players"></ul>

      <div class="host-tools" id="host-tools" hidden>
        <button class="btn btn-gold" id="btn-award">팟 지급</button>
        <button class="btn" id="btn-refund">베팅 환불</button>
        <button class="btn" id="btn-reset">전체 초기화</button>
      </div>

      <div class="sec-h"><h3>기록</h3></div>
      <ul class="log" id="log"></ul>
    </div>
  </section>
</div>

<dialog id="dlg-invite">
  <h3>친구 초대</h3>
  <div class="qr" id="qr"></div>
  <div class="inv-code" id="inv-code"></div>
  <div class="url" id="inv-url"></div>
  <div class="stack-btns">
    <button class="btn" id="btn-copy">링크 복사</button>
    <button class="btn" id="btn-share" hidden>공유하기</button>
    <button class="btn btn-ghost" id="btn-inv-close">닫기</button>
  </div>
</dialog>

<dialog id="dlg-player">
  <h3 id="pl-name"></h3>
  <p class="muted" id="pl-info" style="margin:-6px 0 14px"></p>
  <div class="stack-btns">
    <button class="btn" id="pl-rebuy">리바이</button>
    <button class="btn" id="pl-set">칩 수정</button>
    <button class="btn" id="pl-host">딜러 넘기기</button>
    <button class="btn" id="pl-remove" style="color:var(--danger)">방에서 내보내기</button>
    <button class="btn btn-ghost" id="pl-close">닫기</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* 중계 서버: ntfy.sh (계정 불필요, 메시지는 12시간 보관) */
const NTFY = 'https://ntfy.sh';
const TOPIC_PREFIX = 'chipbank-v1-';
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const CHIP_MULT = [1, 5, 25, 100];
const KINDS = ['베팅', '콜', '레이즈', '올인'];
function hashStr(t) { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0; return h.toString(36); }
const LOBBY = TOPIC_PREFIX + 'lobby-' + hashStr(location.host + location.pathname);
const ROOM_TTL = 12 * 3600 * 1000;
const IN_PREVIEW = !/^https?:$/.test(location.protocol) || /claude|anthropic/i.test(location.hostname);
const NET_HINT = IN_PREVIEW
  ? 'Claude 앱 미리보기에서는 외부 서버 접속이 막혀 있습니다. GitHub Pages 주소로 열어 주세요'
  : '중계 서버에 연결하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도하세요';

const $ = s => document.querySelector(s);
const fmt = n => Number(n || 0).toLocaleString('ko-KR');

let room = null, topic = null, me = null;
let S = null;                 // 기록을 재생해 계산한 현재 상태
let seen = new Set(), lastId = null, es = null, synced = false;
let awardMode = false, selected = new Set(), dlgTarget = null, builtUnit = null, lastPot = null, pendingTimer = null;

/* ---------- 유틸 ---------- */
function show(id) { ['home', 'room'].forEach(k => $('#scr-' + k).hidden = k !== id); }
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }
function buzz() { try { navigator.vibrate && navigator.vibrate(15); } catch {} }
function newId() { return Math.random().toString(36).slice(2, 10); }
function genCode() { let s = ''; for (let i = 0; i < 6; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
const mem = {};
function getLocal(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return mem[k] ?? null; } }
function setLocal(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function inviteUrl() { return location.origin + location.pathname + '?room=' + room; }
function freshState() { return { created: false, stack: 0, unit: 1, host: null, pot: 0, players: {}, seq: 0, log: [] }; }
function sorted() { return Object.entries(S.players).map(([id, p]) => ({ id, ...p })).sort((a, b) => a.o - b.o); }
function maxBet() { return Object.values(S.players).reduce((m, p) => Math.max(m, p.b), 0); }
function isHost() { return S && S.host === me; }
function nm(id) { return S.players[id]?.n || '?'; }
function int(v) { const n = Math.floor(Number(v)); return Number.isFinite(n) ? n : NaN; }

/* ---------- 상태 계산 (모든 폰이 같은 순서로 같은 계산) ---------- */
function addLog(t, m) { S.log.unshift({ t, m }); if (S.log.length > 60) S.log.length = 60; }

function apply(e, t) {
  if (!e || typeof e !== 'object' || typeof e.by !== 'string' || typeof e.k !== 'string') return true;
  const by = e.by, P = S.players, host = S.host === by;
  if (e.k === 'create') {
    if (S.created) return true;
    const s = int(e.s), u = int(e.u);
    if (!(s > 0) || !(u > 0)) return true;
    S.created = true; S.stack = s; S.unit = u; S.host = by; S.createdAt = t;
    P[by] = { n: String(e.n || '딜러').slice(0, 12), c: s, b: 0, o: S.seq++ };
    addLog(t, `${P[by].n}님이 방을 만들었습니다 (시작 칩 ${fmt(s)})`);
    return true;
  }
  if (!S.created) return true;

  switch (e.k) {
    case 'join': {
      const n = String(e.n || '').slice(0, 12).trim(); if (!n) return true;
      if (!P[by]) { P[by] = { n, c: S.stack, b: 0, f: false, o: S.seq++ }; addLog(t, `${n}님 참가 (칩 ${fmt(S.stack)})`); }
      else if (P[by].n !== n) { addLog(t, `${P[by].n} → ${n} 이름 변경`); P[by].n = n; }
      return true;
    }
    case 'check': {
      const p = P[by]; if (!p || p.f) return false;
      addLog(t, `${p.n} 체크`); return true;
    }
    case 'fold': {
      const p = P[by]; if (!p || p.f) return false;
      p.f = true; addLog(t, `${p.n} 다이`); return true;
    }
    case 'unfold': {
      const p = P[by]; if (!p || !p.f) return false;
      p.f = false; addLog(t, `${p.n} 다이 취소`); return true;
    }
    case 'bet': {
      const p = P[by], a = int(e.a);
      if (!p || p.f || !(a > 0) || p.c < a) return false;
      p.c -= a; p.b += a; S.pot += a;
      addLog(t, `${p.n} ${KINDS.includes(e.x) ? e.x : '베팅'} ${fmt(a)}`);
      return true;
    }
  }
  if (!host) return false; // 이하 딜러 전용
  switch (e.k) {
    case 'award': {
      const ws = (Array.isArray(e.w) ? e.w : []).filter(id => P[id]).sort((a, b) => P[a].o - P[b].o);
      if (S.pot <= 0 || !ws.length) return false;
      const pot = S.pot, share = Math.floor(pot / ws.length); let rem = pot - share * ws.length;
      const parts = ws.map(id => { const g = share + (rem > 0 ? 1 : 0); if (rem > 0) rem--; P[id].c += g; return `${P[id].n} ${fmt(g)}`; });
      Object.values(P).forEach(p => { p.b = 0; p.f = false; }); S.pot = 0;
      addLog(t, `팟 ${fmt(pot)} 지급 → ${parts.join(', ')}`);
      return true;
    }
    case 'refund':
      Object.values(P).forEach(p => { p.c += p.b; p.b = 0; p.f = false; }); S.pot = 0;
      addLog(t, '딜러가 이번 판 베팅을 환불했습니다'); return true;
    case 'reset':
      Object.values(P).forEach(p => { p.c = S.stack; p.b = 0; p.f = false; }); S.pot = 0;
      addLog(t, '딜러가 전체 칩을 초기화했습니다'); return true;
    case 'rebuy':
      if (!P[e.p]) return false; P[e.p].c += S.stack; addLog(t, `${P[e.p].n} 리바이 +${fmt(S.stack)}`); return true;
    case 'set': {
      const c = int(e.c); if (!P[e.p] || !(c >= 0)) return false;
      addLog(t, `딜러가 ${P[e.p].n}님 칩을 ${fmt(P[e.p].c)} → ${fmt(c)}으로 수정`); P[e.p].c = c; return true;
    }
    case 'host':
      if (!P[e.p]) return false; S.host = e.p; addLog(t, `딜러가 ${P[e.p].n}님으로 바뀌었습니다`); return true;
    case 'remove':
      if (!P[e.p] || e.p === by) return false; addLog(t, `${P[e.p].n}님이 방에서 나갔습니다`); delete P[e.p]; return true;
  }
  return true;
}

function ingest(msg, live) {
  if (!msg || msg.event !== 'message' || seen.has(msg.id)) return;
  seen.add(msg.id); lastId = msg.id;
  let e; try { e = JSON.parse(msg.message); } catch { return; }
  const ok = apply(e, (msg.time || Date.now() / 1000) * 1000);
  if (live && !ok && e && e.by === me) toast(e.k === 'bet' ? '칩이 부족해 베팅이 취소됐습니다' : '처리되지 않았습니다');
  if (live && e && e.by === me) { clearTimeout(pendingTimer); setBusy(false); }
}

/* ---------- 통신 ---------- */
async function poll(since) {
  const r = await fetch(`${NTFY}/${topic}/json?poll=1&since=${encodeURIComponent(since || 'all')}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('poll ' + r.status);
  const txt = await r.text();
  return txt.split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
}

function openStream() {
  if (es) { es.close(); es = null; }
  es = new EventSource(`${NTFY}/${topic}/sse?since=${encodeURIComponent(lastId || 'all')}`);
  es.onopen = () => $('#conn').classList.add('on');
  es.onerror = () => $('#conn').classList.remove('on');
  es.onmessage = ev => {
    let d; try { d = JSON.parse(ev.data); } catch { return; }
    if (d.event === 'message') { ingest(d, true); render(); }
  };
}

async function resync() {
  if (!topic) return;
  try {
    const msgs = await poll(lastId);
    msgs.forEach(m => ingest(m, true));
    render(); openStream();
  } catch (e) { console.error(e); $('#conn').classList.remove('on'); }
}

async function send(ev) {
  ev.by = me;
  setBusy(true);
  try {
    const r = await fetch(`${NTFY}/${topic}`, { method: 'POST', body: JSON.stringify(ev) });
    if (!r.ok) {
      setBusy(false);
      toast(r.status === 429 ? '중계 서버 요청 한도에 걸렸습니다. 잠시 뒤 다시 누르세요' : `전송 실패 (${r.status})`);
      return false;
    }
    // 스트림으로 되돌아오지 않으면 직접 다시 받아오기
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => { setBusy(false); resync(); }, 3000);
    return true;
  } catch (e) {
    setBusy(false); toast('전송하지 못했습니다. 인터넷 연결을 확인하세요'); return false;
  }
}
function setBusy(b) { document.body.classList.toggle('busy', b); }

/* ---------- 방 입장 ---------- */
async function enterRoom(code) {
  room = code; topic = TOPIC_PREFIX + code;
  const saved = getLocal('chipbank:' + code);
  me = saved?.pid || newId();
  setLocal('chipbank:' + code, { pid: me, name: saved?.name || '' });
  S = freshState(); seen = new Set(); lastId = null; synced = false;
  awardMode = false; selected.clear(); builtUnit = null; lastPot = null;
  history.replaceState(null, '', '?room=' + code);
  $('#room-code').textContent = code;
  $('#loading').hidden = false; $('#missing').hidden = true; $('#room-body').hidden = true;
  show('room');
  try {
    const msgs = await poll('all');
    msgs.forEach(m => ingest(m, false));
  } catch (e) {
    console.error(e); $('#loading').textContent = NET_HINT; return;
  }
  synced = true;
  $('#loading').hidden = true;
  if (!S.created) { $('#missing').hidden = false; return; }
  rememberRoom(code, S.players[S.host]?.n || '', S.stack, S.createdAt);
  $('#room-body').hidden = false;
  if (!S.players[me] && saved?.name) $('#join-name').value = saved.name;
  render(); openStream(); keepAwake();
}

async function createRoom() {
  const name = $('#host-name').value.trim();
  const s = int($('#host-stack').value), u = int($('#host-unit').value);
  if (!name) return toast('이름을 입력하세요');
  if (!(s > 0) || !(u > 0)) return toast('시작 칩과 최소 단위는 1 이상이어야 합니다');
  if (u > s) return toast('최소 단위가 시작 칩보다 큽니다');
  $('#btn-create').disabled = true;
  try {
    let code;
    for (let i = 0; i < 5; i++) {
      code = genCode(); topic = TOPIC_PREFIX + code;
      const ex = await poll('all');
      if (!ex.length) break;
    }
    me = newId(); room = code;
    setLocal('chipbank:' + code, { pid: me, name });
    const r = await fetch(`${NTFY}/${topic}`, { method: 'POST', body: JSON.stringify({ k: 'create', by: me, n: name, s, u }) });
    if (!r.ok) throw new Error('create ' + r.status);
    fetch(`${NTFY}/${LOBBY}`, { method: 'POST', body: JSON.stringify({ code, n: name, s }) }).catch(() => {});
    await enterRoom(code);
    setTimeout(openInvite, 300);
  } catch (e) {
    console.error(e); toast(NET_HINT);
  } finally { $('#btn-create').disabled = false; }
}

/* ---------- 방 목록 ---------- */
function myRooms() { const r = getLocal('chipbank:rooms'); return Array.isArray(r) ? r : []; }
function rememberRoom(code, host, s, t) {
  const list = myRooms().filter(x => x.code !== code);
  list.unshift({ code, host, s, t: t || Date.now() });
  setLocal('chipbank:rooms', list.filter(x => Date.now() - x.t < ROOM_TTL).slice(0, 20));
}
function ago(t) {
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  return m < 1 ? '방금' : m < 60 ? `${m}분 전` : `${Math.floor(m / 60)}시간 전`;
}
let lobbyLoading = false;
async function loadLobby() {
  if (lobbyLoading) return; lobbyLoading = true;
  const ul = $('#rooms');
  const map = new Map();
  myRooms().forEach(r => map.set(r.code, { ...r }));
  // 목록 기능 이전에 들어갔던 방도 표시
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i), m = /^chipbank:([A-Z0-9]{6})$/.exec(k || '');
      if (m && !map.has(m[1])) map.set(m[1], { code: m[1], host: '', s: 0, t: Date.now() });
    }
  } catch {}
  let err = false;
  try {
    const r = await fetch(`${NTFY}/${LOBBY}/json?poll=1&since=12h`, { cache: 'no-store' });
    if (!r.ok) throw new Error('lobby ' + r.status);
    (await r.text()).split('\n').filter(Boolean).forEach(l => {
      let m, e; try { m = JSON.parse(l); e = JSON.parse(m.message); } catch { return; }
      if (m.event !== 'message' || !e || !/^[A-Z0-9]{6}$/.test(e.code)) return;
      const t = (m.time || 0) * 1000;
      const prev = map.get(e.code) || {};
      map.set(e.code, { code: e.code, host: String(e.n || prev.host || '').slice(0, 12), s: int(e.s) || prev.s, t: prev.t || t });
    });
  } catch (e) { console.error(e); err = true; }
  lobbyLoading = false;

  const list = [...map.values()].filter(x => Date.now() - x.t < ROOM_TTL).sort((a, b) => b.t - a.t);
  ul.innerHTML = '';
  if (!list.length) {
    const li = document.createElement('li'); li.className = 'muted';
    li.textContent = err ? NET_HINT : '열린 방이 없습니다. 아래에서 새 방을 만드세요';
    ul.appendChild(li); return;
  }
  list.forEach(x => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.className = 'room-btn';
    const rc = document.createElement('span'); rc.className = 'rc'; rc.textContent = x.code;
    const ri = document.createElement('span'); ri.className = 'ri';
    const hb = document.createElement('b'); hb.textContent = x.host ? `${x.host}님의 방` : '방';
    ri.append(hb, document.createElement('br'), `${x.s ? '시작 칩 ' + fmt(x.s) + ' · ' : ''}${ago(x.t)}`);
    b.append(rc, ri);
    if (getLocal('chipbank:' + x.code)?.name) { const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = '참가 중'; b.appendChild(tg); }
    b.onclick = () => enterRoom(x.code);
    li.appendChild(b); ul.appendChild(li);
  });
}
function showHome() { show('home'); loadLobby(); }

function goHome() {
  if (es) { es.close(); es = null; }
  room = topic = null; S = null;
  history.replaceState(null, '', location.pathname);
  showHome();
}

/* ---------- 렌더 ---------- */
function buildChips() {
  const row = $('#chip-row'); row.innerHTML = '';
  CHIP_MULT.forEach((m, i) => {
    const v = S.unit * m, b = document.createElement('button');
    b.className = 'chip c' + (i + 1); b.dataset.v = v; b.setAttribute('aria-label', fmt(v) + ' 추가');
    const sp = document.createElement('span'); sp.textContent = short(v); b.appendChild(sp);
    b.onclick = () => {
      const c = S.players[me]?.c || 0;
      $('#stake').value = Math.min((int($('#stake').value) || 0) + v, c); buzz(); syncStake();
    };
    row.appendChild(b);
  });
  builtUnit = S.unit;
}
function short(v) { if (v >= 1e6 && v % 1e5 === 0) return v / 1e6 + 'M'; if (v >= 1e4 && v % 100 === 0) return v / 1000 + 'K'; return String(v); }
function tag(t, c) { const s = document.createElement('span'); s.className = 'tag ' + c; s.textContent = t; return s; }

function render() {
  if (!S || !synced || !S.created) return;
  if (builtUnit !== S.unit) buildChips();
  const list = sorted(), mine = S.players[me], host = isHost(), mb = maxBet();

  const pa = $('#pot-amt'); pa.textContent = fmt(S.pot);
  if (lastPot !== null && lastPot !== S.pot) { pa.classList.remove('bump'); void pa.offsetWidth; pa.classList.add('bump'); }
  lastPot = S.pot;
  $('#pot-sub').textContent = mb > 0 ? `팟 · 이번 판 최고 베팅 ${fmt(mb)}` : '팟';
  const st = $('#pot-stack'); st.innerHTML = '';
  if (S.pot > 0) {
    const n = Math.min(9, 1 + Math.floor(Math.log10(S.pot / S.unit + 1) * 2.6));
    const cols = ['var(--red)', 'var(--blue)', 'var(--ivory)', 'var(--ink)'];
    for (let i = 0; i < n; i++) { const d = document.createElement('i'); d.style.setProperty('--c', cols[i % 4]); d.style.transform = `translateX(${(i % 3 - 1) * 2}px)`; st.appendChild(d); }
  }

  $('#join-panel').hidden = !!mine;
  $('#mine').hidden = !mine;
  if (mine) {
    $('#my-chips').textContent = fmt(mine.c);
    $('#my-bet').textContent = fmt(mine.b);
    const toCall = Math.max(0, mb - mine.b), amt = Math.min(toCall, mine.c), cb = $('#btn-call');
    cb.dataset.amt = amt;
    const folded = !!mine.f;
    cb.textContent = toCall > 0 ? (amt < toCall ? `콜 ${fmt(amt)} (올인)` : `콜 ${fmt(amt)}`) : '체크';
    cb.disabled = folded || (toCall > 0 && amt <= 0);
    $('#btn-allin').disabled = folded || mine.c <= 0;
    $('#btn-fold').disabled = folded;
    $('#fold-note').hidden = !folded;
    document.querySelectorAll('.chip').forEach(c => c.disabled = folded || +c.dataset.v > mine.c);
    syncStake();
  }

  $('#host-tools').hidden = !host;
  $('#host-hint').textContent = host ? '이름을 누르면 칩 관리' : '';
  $('#btn-award').disabled = S.pot <= 0;
  $('#btn-refund').disabled = S.pot <= 0;
  if (!host && awardMode) { awardMode = false; selected.clear(); }
  $('#award-bar').hidden = !awardMode;

  const ul = $('#players'); ul.innerHTML = '';
  list.forEach(p => {
    const li = document.createElement('li');
    if (host) li.classList.add('tap');
    if (p.c <= 0) li.classList.add('bust');
    if (p.f) li.classList.add('fold');
    if (awardMode && selected.has(p.id)) li.classList.add('sel');
    if (awardMode) { const k = document.createElement('span'); k.className = 'pick'; li.appendChild(k); }
    const n = document.createElement('div'); n.className = 'nm'; n.textContent = p.n;
    if (p.id === me) n.appendChild(tag('나', 'me'));
    if (p.id === S.host) n.appendChild(tag('딜러', 'host'));
    if (p.f) n.appendChild(tag('다이', 'fold'));
    const bt = document.createElement('div'); bt.className = 'bt';
    if (p.b > 0) { bt.append('베팅 '); const b = document.createElement('b'); b.textContent = fmt(p.b); bt.appendChild(b); }
    const ch = document.createElement('div'); ch.className = 'ch'; ch.textContent = fmt(p.c);
    li.append(n, bt, ch);
    li.onclick = () => {
      if (awardMode) { selected.has(p.id) ? selected.delete(p.id) : selected.add(p.id); buzz(); render(); }
      else if (host) openPlayer(p.id);
    };
    ul.appendChild(li);
  });

  const lg = $('#log'); lg.innerHTML = '';
  S.log.slice(0, 30).forEach(it => {
    const li = document.createElement('li'), t = document.createElement('time'), d = new Date(it.t);
    t.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    const m = document.createElement('span'); m.textContent = it.m; li.append(t, m); lg.appendChild(li);
  });
}

function syncStake() {
  const mine = S?.players[me]; if (!mine) return;
  const v = Math.max(0, int($('#stake').value) || 0), b = $('#btn-bet');
  b.disabled = !!mine.f || v <= 0 || v > mine.c;
  b.textContent = v > mine.c ? '칩이 부족합니다' : (v > 0 ? `${fmt(v)} 베팅` : '베팅');
}

/* ---------- 액션 ---------- */
async function bet(a, x) {
  const mine = S.players[me]; if (!mine || !(a > 0) || a > mine.c) return;
  if (await send({ k: 'bet', a, x })) { $('#stake').value = 0; syncStake(); buzz(); }
}
function kindOf(v) {
  const mine = S.players[me], mb = maxBet(), after = mine.b + v;
  if (v === mine.c) return '올인';
  if (mb === 0) return '베팅';
  return after > mb ? '레이즈' : after === mb ? '콜' : '베팅';
}

function openPlayer(id) {
  const p = S.players[id]; if (!p) return; dlgTarget = id;
  $('#pl-name').textContent = p.n;
  $('#pl-info').textContent = `보유 ${fmt(p.c)} · 이번 판 베팅 ${fmt(p.b)}`;
  $('#pl-rebuy').textContent = `리바이 (+${fmt(S.stack)})`;
  $('#pl-host').hidden = id === me; $('#pl-remove').hidden = id === me;
  $('#dlg-player').showModal();
}
async function playerAction(kind) {
  const id = dlgTarget, p = S.players[id]; if (!p) return $('#dlg-player').close();
  if (kind === 'set') {
    const v = prompt(`${p.n}님의 보유 칩을 얼마로 바꿀까요?`, p.c); if (v === null) return;
    const c = int(v); if (!(c >= 0)) return toast('0 이상의 숫자를 입력하세요');
    await send({ k: 'set', p: id, c });
  } else if (kind === 'host') {
    if (!confirm(`${p.n}님에게 딜러 권한을 넘길까요?`)) return;
    await send({ k: 'host', p: id });
  } else if (kind === 'remove') {
    if (!confirm(`${p.n}님을 내보낼까요? 보유 칩은 사라지고, 이번 판 베팅은 팟에 남습니다.`)) return;
    await send({ k: 'remove', p: id });
  } else await send({ k: 'rebuy', p: id });
  $('#dlg-player').close();
}

function openInvite() {
  const url = inviteUrl(), box = $('#qr'); box.innerHTML = '';
  const size = Math.min(240, window.innerWidth - 110);
  new QRCode(box, { text: url, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  $('#inv-code').textContent = room; $('#inv-url').textContent = url;
  $('#btn-share').hidden = !navigator.share;
  $('#dlg-invite').showModal();
}

async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && topic && synced) { resync(); keepAwake(); }
});

/* ---------- 이벤트 ---------- */
$('#btn-create').onclick = createRoom;
$('#btn-lobby-refresh').onclick = loadLobby;
$('#join-code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
$('#btn-go').onclick = () => { const c = $('#join-code').value.trim(); if (c.length !== 6) return toast('방 코드 6자리를 입력하세요'); enterRoom(c); };
$('#btn-join').onclick = async () => {
  const n = $('#join-name').value.trim(); if (!n) return toast('이름을 입력하세요');
  setLocal('chipbank:' + room, { pid: me, name: n });
  await send({ k: 'join', n });
};
$('#join-name').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btn-join').click(); });
$('#btn-missing-home').onclick = goHome;
$('#btn-home').onclick = () => { if (confirm('처음 화면으로 갈까요? 내 자리와 칩은 그대로 남습니다.')) goHome(); };

$('#stake').addEventListener('input', syncStake);
$('#btn-clear').onclick = () => { $('#stake').value = 0; syncStake(); };
$('#btn-bet').onclick = () => { const v = int($('#stake').value) || 0; if (v > 0) bet(v, kindOf(v)); };
$('#btn-call').onclick = async () => {
  const a = +$('#btn-call').dataset.amt || 0;
  if (a > 0) bet(a, a === S.players[me].c ? '올인' : '콜');
  else if (await send({ k: 'check' })) buzz();
};
$('#btn-fold').onclick = async () => { if (confirm('이번 판 다이할까요?') && await send({ k: 'fold' })) { $('#stake').value = 0; buzz(); } };
$('#btn-unfold').onclick = () => send({ k: 'unfold' });
$('#btn-allin').onclick = () => { const m = S.players[me]; if (m && m.c > 0 && confirm(`${fmt(m.c)} 전부 올인할까요?`)) bet(m.c, '올인'); };

$('#btn-invite').onclick = openInvite;
$('#btn-inv-close').onclick = () => $('#dlg-invite').close();
$('#btn-copy').onclick = async () => { try { await navigator.clipboard.writeText(inviteUrl()); toast('링크를 복사했습니다'); } catch { toast('복사하지 못했습니다. 주소를 길게 눌러 복사하세요'); } };
$('#btn-share').onclick = () => navigator.share({ title: '칩 뱅크 초대', text: `방 코드 ${room}`, url: inviteUrl() }).catch(() => {});

$('#btn-award').onclick = () => { awardMode = true; selected.clear(); render(); $('#award-bar').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
$('#btn-award-cancel').onclick = () => { awardMode = false; selected.clear(); render(); };
$('#btn-award-ok').onclick = async () => {
  if (!selected.size) return toast('받을 사람을 한 명 이상 고르세요');
  if (await send({ k: 'award', w: [...selected] })) { awardMode = false; selected.clear(); render(); buzz(); }
};
$('#btn-refund').onclick = () => { if (confirm('이번 판 베팅을 모두 각자에게 돌려줄까요?')) send({ k: 'refund' }); };
$('#btn-reset').onclick = () => { if (confirm(`모든 참가자의 칩을 ${fmt(S.stack)}으로 되돌리고 팟을 비울까요?`)) send({ k: 'reset' }); };
$('#pl-rebuy').onclick = () => playerAction('rebuy');
$('#pl-set').onclick = () => playerAction('set');
$('#pl-host').onclick = () => playerAction('host');
$('#pl-remove').onclick = () => playerAction('remove');
$('#pl-close').onclick = () => $('#dlg-player').close();

/* ---------- 시작 ---------- */
const q = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
if (q.length === 6) enterRoom(q); else showHome();
</script>

</body>
</html>
